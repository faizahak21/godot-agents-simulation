<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title description">
  <title id="title">Cycle de vie d’un agent</title>
  <desc id="description">Diagramme d’états UML d’un employé assis qui attend l’alarme, réagit, se lève puis évacue, ou termine en timeout.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#455b6a"/>
    </marker>
    <style>
      .title { font: 700 28px 'Segoe UI', sans-serif; fill: #243740; }
      .subtitle { font: 15px 'Segoe UI', sans-serif; fill: #60727a; }
      .state { fill: #edf3f1; stroke: #416d70; stroke-width: 2.2; }
      .terminal { fill: #fff2e8; stroke: #bd684b; stroke-width: 2.2; }
      .state-label { font: 600 17px 'Segoe UI', sans-serif; fill: #263b43; text-anchor: middle; }
      .detail { font: 13px 'Segoe UI', sans-serif; fill: #52676e; text-anchor: middle; }
      .transition { fill: none; stroke: #455b6a; stroke-width: 2; marker-end: url(#arrow); }
      .timeout-transition { fill: none; stroke: #bd684b; stroke-width: 2; marker-end: url(#arrow); }
      .transition-label { font: 13px 'Segoe UI', sans-serif; fill: #465c64; text-anchor: middle; }
      .timeout-label { font: 13px 'Segoe UI', sans-serif; fill: #a6533b; text-anchor: middle; }
      .note { font: 14px 'Segoe UI', sans-serif; fill: #52676e; }
    </style>
  </defs>

  <rect width="1200" height="620" fill="#ffffff"/>
  <text class="title" x="48" y="52">Cycle de vie d’un agent</text>
  <text class="subtitle" x="48" y="80">Simulation d’évacuation d’un bureau — diagramme d’états UML</text>

  <circle cx="36" cy="227" r="12" fill="#263b43"/>
  <path class="transition" d="M48 227 H72"/>

  <rect class="state" x="78" y="185" width="150" height="84" rx="18"/>
  <text class="state-label" x="153" y="220">Assis au poste</text>
  <text class="detail" x="153" y="244">corps immobile</text>

  <rect class="state" x="278" y="185" width="150" height="84" rx="18"/>
  <text class="state-label" x="353" y="220">Attend l’alarme</text>
  <text class="detail" x="353" y="244">compte à rebours</text>

  <rect class="state" x="478" y="185" width="150" height="84" rx="18"/>
  <text class="state-label" x="553" y="220">Réagit</text>
  <text class="detail" x="553" y="244">délai individuel</text>

  <rect class="state" x="678" y="185" width="150" height="84" rx="18"/>
  <text class="state-label" x="753" y="220">Se lève</text>
  <text class="detail" x="753" y="244">animation de lever</text>

  <rect class="state" x="878" y="185" width="150" height="84" rx="18"/>
  <text class="state-label" x="953" y="220">Évacue</text>
  <text class="detail" x="953" y="244">suit son itinéraire</text>

  <rect class="terminal" x="1060" y="185" width="112" height="84" rx="18"/>
  <text class="state-label" x="1116" y="232">Évacué</text>

  <path class="transition" d="M228 227 H270"/>
  <text class="transition-label" x="249" y="211">installé</text>
  <path class="transition" d="M428 227 H470"/>
  <text class="transition-label" x="449" y="205">alarme</text>
  <text class="transition-label" x="449" y="220">déclenchée</text>
  <path class="transition" d="M628 227 H670"/>
  <text class="transition-label" x="649" y="205">délai écoulé</text>
  <path class="transition" d="M828 227 H870"/>
  <text class="transition-label" x="849" y="205">lever terminé</text>
  <path class="transition" d="M1028 227 H1052"/>
  <text class="transition-label" x="1040" y="205">sortie</text>

  <rect class="terminal" x="500" y="390" width="200" height="86" rx="18"/>
  <text class="state-label" x="600" y="426">Timeout</text>
  <text class="detail" x="600" y="450">agents restants enregistrés</text>

  <path class="timeout-transition" d="M553 269 V330 Q553 356 576 382"/>
  <path class="timeout-transition" d="M753 269 V330 Q753 356 624 382"/>
  <path class="timeout-transition" d="M953 269 V330 Q953 356 650 382"/>
  <text class="timeout-label" x="600" y="322">180 s écoulées depuis l’alarme</text>
  <path class="transition" d="M700 433 H760"/>
  <circle cx="774" cy="433" r="12" fill="none" stroke="#bd684b" stroke-width="3"/>
  <circle cx="774" cy="433" r="7" fill="#bd684b"/>

  <line x1="48" y1="530" x2="1152" y2="530" stroke="#dce5e3" stroke-width="1.5"/>
  <text class="note" x="48" y="562">Le chronomètre d’évacuation démarre au déclenchement de l’alarme.</text>
  <text class="note" x="48" y="586">Les délais de réaction varient selon les agents; le timeout survient à 180 s.</text>
</svg>