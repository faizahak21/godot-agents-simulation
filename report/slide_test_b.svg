<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Test B — Influence de la largeur de porte</title>
  <desc id="desc">Résultats d’une simulation d’évacuation de 60 agents pour six largeurs de porte, avec débit moyen et décompte des timeouts.</desc>
  <defs>
    <style>
      text { font-family: 'Aptos', 'Segoe UI', sans-serif; }
      .eyebrow { font-size: 18px; font-weight: 700; letter-spacing: 1.5px; fill: #a9563d; }
      .title { font-size: 43px; font-weight: 700; fill: #18333b; }
      .subtitle { font-size: 21px; fill: #53696e; }
      .axis { font-size: 18px; fill: #435b61; }
      .tick { font-size: 16px; fill: #63777b; }
      .grid { stroke: #dce5e2; stroke-width: 1.5; }
      .axis-line { stroke: #52686d; stroke-width: 2; }
      .point { fill: #bf563f; stroke: #fff; stroke-width: 4; }
      .value { font-size: 16px; font-weight: 700; fill: #8e402f; text-anchor: middle; }
      .width-label { font-size: 16px; fill: #485f64; text-anchor: middle; }
      .panel-head { font-size: 18px; font-weight: 700; letter-spacing: .8px; fill: #a9563d; }
      .panel-main { font-size: 29px; font-weight: 700; fill: #18333b; }
      .panel-copy { font-size: 19px; fill: #52686d; }
      .row-label { font-size: 18px; fill: #395157; }
      .row-value { font-size: 18px; font-weight: 700; fill: #18333b; text-anchor: end; }
      .small { font-size: 16px; fill: #65787c; }
      .note { font-size: 18px; font-weight: 600; fill: #744534; }
      .footer { font-size: 15px; fill: #6b7c80; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="#f6f7f2"/>
  <rect x="0" y="0" width="18" height="900" fill="#bf563f"/>

  <text class="eyebrow" x="78" y="75">SIMULATION D’ÉVACUATION · TEST B</text>
  <text class="title" x="78" y="132">Une porte plus large améliore-t-elle le débit ?</text>
  <text class="subtitle" x="80" y="174">60 agents · force 40 · sans pilier · une seule sortie · 5 graines par largeur</text>

  <rect x="65" y="215" width="1005" height="560" rx="12" fill="#ffffff" stroke="#e0e7e2" stroke-width="1.5"/>
  <text class="panel-head" x="105" y="258">DÉBIT MOYEN DES ÉVACUATIONS COMPLÈTES</text>

  <line class="grid" x1="190" y1="660" x2="1015" y2="660"/>
  <line class="grid" x1="190" y1="550" x2="1015" y2="550"/>
  <line class="grid" x1="190" y1="440" x2="1015" y2="440"/>
  <line class="grid" x1="190" y1="330" x2="1015" y2="330"/>
  <line class="grid" x1="190" y1="275" x2="1015" y2="275"/>
  <line class="axis-line" x1="190" y1="275" x2="190" y2="660"/>
  <line class="axis-line" x1="190" y1="660" x2="1015" y2="660"/>

  <text class="tick" x="165" y="666" text-anchor="end">2,0</text>
  <text class="tick" x="165" y="556" text-anchor="end">2,5</text>
  <text class="tick" x="165" y="446" text-anchor="end">3,0</text>
  <text class="tick" x="165" y="336" text-anchor="end">3,5</text>
  <text class="tick" x="165" y="281" text-anchor="end">3,75</text>

  <g class="tick" text-anchor="middle">
    <text x="190" y="692">0,5</text>
    <text x="355" y="692">1,0</text>
    <text x="520" y="692">1,5</text>
    <text x="685" y="692">2,0</text>
    <text x="850" y="692">2,5</text>
    <text x="1015" y="692">3,0</text>
  </g>
  <text class="axis" x="602" y="738" text-anchor="middle">Largeur de porte (m)</text>
  <text class="axis" transform="translate(105 472) rotate(-90)" text-anchor="middle">Débit moyen (agents/s)</text>

  <circle class="point" cx="289" cy="588" r="11"/>
  <text class="value" x="289" y="565">2,33*</text>
  <text class="width-label" x="289" y="718">0,8 m</text>

  <circle class="point" cx="355" cy="517" r="11"/>
  <text class="value" x="355" y="494">2,65</text>
  <text class="width-label" x="355" y="718">1,0 m</text>

  <circle class="point" cx="421" cy="409" r="11"/>
  <text class="value" x="421" y="386">3,14</text>
  <text class="width-label" x="421" y="718">1,2 m</text>

  <circle class="point" cx="520" cy="350" r="11"/>
  <text class="value" x="520" y="327">3,41</text>
  <text class="width-label" x="520" y="718">1,5 m</text>

  <circle class="point" cx="685" cy="368" r="11"/>
  <text class="value" x="685" y="345">3,33</text>
  <text class="width-label" x="685" y="718">2,0 m</text>

  <circle class="point" cx="1015" cy="340" r="11"/>
  <text class="value" x="990" y="316">3,46</text>
  <text class="width-label" x="1015" y="718">3,0 m</text>

  <rect x="1100" y="215" width="435" height="330" rx="12" fill="#e8efec"/>
  <text class="panel-head" x="1140" y="260">CE QU’ON OBSERVE</text>
  <text class="panel-main" x="1140" y="313">+49 % de débit</text>
  <text class="panel-copy" x="1140" y="344">entre 0,8 m* et 3,0 m</text>
  <line x1="1140" y1="372" x2="1495" y2="372" stroke="#cad8d3" stroke-width="1.5"/>
  <text class="row-label" x="1140" y="412">Porte 0,8 m</text>
  <text class="row-value" x="1495" y="412">4 timeouts / 5</text>
  <text class="row-label" x="1140" y="453">Porte 1,5 m</text>
  <text class="row-value" x="1495" y="453">1 timeout / 5</text>
  <text class="row-label" x="1140" y="494">Porte 3,0 m</text>
  <text class="row-value" x="1495" y="494">0 timeout / 5</text>

  <rect x="1100" y="570" width="435" height="205" rx="12" fill="#fff1e8" stroke="#efd6c8" stroke-width="1.5"/>
  <text class="panel-head" x="1140" y="612">À INTERPRÉTER AVEC PRUDENCE</text>
  <text class="note" x="1140" y="651">À 0,8 m, un seul essai complet</text>
  <text class="note" x="1140" y="678">sur cinq; moyenne provisoire.</text>
  <text class="small" x="1140" y="719">Les timeouts sont rapportés à part,</text>
  <text class="small" x="1140" y="743">pas utilisés comme temps d’évacuation.</text>

  <text class="footer" x="78" y="835">Débit calculé par essai complet : 60 agents ÷ temps total · Alarmes et réactions incluses dans le temps.</text>
  <text class="footer" x="78" y="862">Résultats de simulation qualitatifs · Force 40 provisoire · Pas de prédiction pour un bâtiment réel.</text>
</svg>
